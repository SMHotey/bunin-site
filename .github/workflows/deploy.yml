name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  schedule:
    # Ежедневная пересборка в 06:30 МСК: публикации с датой «сегодня» выходят сами
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Даты «Обновлено» и lastmod берутся из истории коммитов
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Сборка и проверки
        run: npm run verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Индексация — только после успешной выкладки: иначе поисковики получают адреса,
  # которых на сайте ещё нет. Шаг необязательный: если он упал, сайт уже обновлён.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Пересборка (нужен список адресов страниц)
        run: node scripts/build.mjs
      - name: IndexNow — отправка правленных адресов Яндексу и Bing
        run: node scripts/indexnow.mjs --recent 2

  # Партнёрские ссылки проверяются после выкладки: карточки товаров снимают с продажи,
  # и мёртвая ссылка должна всплывать сама, а не находиться вручную. Красный статус
  # этого job'а — сигнал поправить data/books.json или data/audiobooks.json;
  # на публикацию он уже не влияет (сайт обновлён предыдущим job'ом).
  affiliates:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Актуальность партнёрских ссылок (Читай-город, ЛитРес)
        run: node scripts/check-affiliate.mjs
      - name: Отчёт проверки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-report
          path: reports/affiliate-report.json
